name: "Terraform & Docker Deploy to GCP"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: "Build and Deploy"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. キーレス認証（GCPとOIDC）
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: 'projects/1047664134161/locations/global/workloadIdentityPools/github-pool-v2/providers/github-provider'
          service_account: 'github-actions-sa@bigquery-s3-cloudrun.iam.gserviceaccount.com'

      # 2. Terraformのセットアップと適用（Artifact Registryリポジトリなどを先に作成）
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Apply (インフラ作成)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: terraform
        run: |
          terraform apply -auto-approve \
            -var="project_id=bigquery-s3-cloudrun" \
            -var="region=asia-northeast1" \
            -var='allowed_user_email=["suzushika.yuki3@gmail.com", "iucidium.phosphorus@gmail.com"]'

      # 3. DockerをGCP (Artifact Registry) にログインさせる
      - name: Authenticate Docker to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: asia-northeast1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.auth_token }}

      # 4. Dockerイメージのビルド＆プッシュ（インフラ作成後に行う）
      - name: Build and Push Docker Container
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          IMAGE_BASE="asia-northeast1-docker.pkg.dev/bigquery-s3-cloudrun/cloudrun-repo/my-web-app"
          docker build -t $IMAGE_BASE:${{ github.sha }} -t $IMAGE_BASE:latest .
          docker push --all-tags asia-northeast1-docker.pkg.dev/bigquery-s3-cloudrun/cloudrun-repo/my-web-app

      # 5. イメージがプッシュされた後にもう一度 Terraform Apply を走らせる（またはCloud Runに最新イメージを反映させる）
      - name: Terraform Apply (Cloud Runにイメージをデプロイ)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: terraform
        run: |
          terraform apply -auto-approve \
            -var="project_id=bigquery-s3-cloudrun" \
            -var="region=asia-northeast1" \
            -var='allowed_user_email=["suzushika.yuki3@gmail.com", "iucidium.phosphorus@gmail.com"]'
